<!doctype html>
<html>
<head>
  <title>Phishing Detection Settings</title>
  <style>
      * {
          box-sizing: border-box;
      }

      html,
      body {
          width: 100%;
          min-height: 100%;
          margin: 0;
      }

      body {
          --bg: #1f2126;
          --panel: #292c33;
          --border: #3b3f48;
          --text: #f2f3f5;
          --muted: #a6aab4;
          --accent: #8ab4f8;

          display: flex;
          flex-direction: column;
          gap: 16px;
          padding: 24px;
          overflow: auto;
          background: var(--bg);
          color: var(--text);
          font: 14px/1.5 Arial, sans-serif;
      }

      h1 {
          width: 100%;
          margin: 0;
          padding-bottom: 13px;
          border-bottom: 1px solid var(--border);
          font-size: 21px;
          font-weight: 600;
      }

      p {
          display: flex;
          flex: 1;
          flex-direction: column;
          gap: 12px;
          width: 100%;
          min-height: 300px;
          margin: 0;
      }

      textarea {
          flex: 1;
          width: 100%;
          min-height: 240px;
          padding: 14px;
          border: 1px solid var(--border);
          border-radius: 8px;
          outline: none;
          resize: vertical;
          background: var(--panel);
          color: var(--text);
          font: 13px/1.55 Consolas, "Courier New", monospace;
          tab-size: 2;
      }

      textarea:focus {
          border-color: var(--accent);
          box-shadow: 0 0 0 2px rgb(138 180 248 / 18%);
      }

      button {
          align-self: flex-end;
          min-width: 100px;
          min-height: 36px;
          padding: 8px 16px;
          border: 1px solid var(--accent);
          border-radius: 6px;
          background: var(--accent);
          color: #18202b;
          font: inherit;
          font-weight: 600;
          cursor: pointer;
          transition: background-color 120ms ease, border-color 120ms ease;
      }

      button:hover {
          border-color: #a3c4fa;
          background: #a3c4fa;
      }

      button:focus-visible {
          outline: 2px solid var(--accent);
          outline-offset: 3px;
      }
  </style>
</head>
<body>
<h1><i18n>phishing-settings-title</i18n></h1>

<p>
  <textarea aria-label="rules" cols="50"></textarea>
  <button type="button">
    <i18n>save</i18n>
  </button>
</p>

<script defer src="settings.js"></script>
<script defer src="i18n.js"></script>
</body>
</html>
